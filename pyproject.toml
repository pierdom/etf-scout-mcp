[project]
name = "etf-scout-mcp"
version = "0.1.0"
description = "MCP server for ETF research via justETF and Yahoo Finance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "yfinance>=0.2.50",
    "justetf-scraping @ git+https://github.com/druzsan/justetf-scraping.git@af8b7409a15c3b7fb62af7dc8fe41ab9513369c5",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # already an indirect dependency (justetf-scraping/yfinance both pull it in) —
    # made explicit now that sources/justetf.py imports it directly for pd.isna().
    "pandas>=2.0",
]

[project.scripts]
etf-scout-mcp = "etf_scout_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_scout_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
